apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
type: Opaque
stringData:
  POSTGRES_USER: project_user
  POSTGRES_PASSWORD: <POSTGRES_PASSWORD>
  OPENAI_API_KEY: <OPENAI_API_KEY>
  PINECONE_API_KEY: <PINECONE_API_KEY>
  PINECONE_INDEX_NAME_OPENAI: <PINECONE_INDEX_NAME_OPENAI>

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
type: Opaque
stringData:
  POSTGRES_USER: project_user
  POSTGRES_PASSWORD: <POSTGRES_PASSWORD>
  POSTGRES_DB: project_db

---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: <GF_SECURITY_ADMIN_PASSWORD>             # default is "admin"