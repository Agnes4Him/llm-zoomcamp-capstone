apiVersion: apps/v1
kind: Deployment

metadata:
  name: healthsecure-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: healthsecure-api

  template:
    metadata:
      labels:
        app: healthsecure-api

    spec:
      containers:
        - name: healthsecure-api
          image: my-registry/healthsecure-api:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: healthsecure-api-config
            - secretRef:
                name: healthsecure-api-secrets

          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20